name: Repository Activity Keepalive

on:
  schedule:
    # Runs on the 1st and 15th of every month at midnight UTC
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Keepalive Pulse
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u > .keepalive
          git add .keepalive
          git commit -m "chore: refresh repository keepalive pulse [skip ci]" || exit 0
          git push
